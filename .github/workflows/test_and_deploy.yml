# Runs the test matrix on every push/PR, and publishes to PyPI (via Trusted
# Publishing / OIDC) when a "v*" tag is pushed.
# See: https://docs.pypi.org/trusted-publishers/
name: tests

on:
  push:
    branches:
      - main
      - npe2
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
      - npe2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"
      - name: Install Windows OpenGL
        uses: pyvista/setup-headless-display-action@v4.3
        with:
          qt: true
          wm: herbstluftwm


      # note: if you need dependencies from conda, considering using
      # setup-miniconda: https://github.com/conda-incubator/setup-miniconda
      # and
      # tox-conda: https://github.com/tox-dev/tox-conda
      # this runs the platform-specific tests declared in tox.ini
      - name: Test with tox
        run: uvx --with tox-gh-actions tox
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Coverage
        uses: codecov/codecov-action@v7

  build-and-inspect-package:
    name: Build & inspect package.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm derives the version from git tags/history, so the
          # full history (not a shallow clone) must be fetched.
          fetch-depth: 0
      - uses: hynek/build-and-inspect-python-package@v2.18.0

  deploy:
    name: Deploy
    needs: [test, build-and-inspect-package]
    # Runs only for pushed tags starting with "v" (e.g. v1.2.3), after the test
    # and build jobs pass. Creates a GitHub Release with the built artifacts;
    # PyPI publishing is wired up but disabled (see the "Publish to PyPI" step).
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      # IMPORTANT: mandatory for trusted publishing on PyPI
      # https://docs.pypi.org/trusted-publishers/
      id-token: write
      # allows creating GitHub Releases
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm needs full history/tags to derive the version
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        # DISABLED until the package is ready for PyPI: the direct git-URL
        # dependencies must be removed/replaced first, and a trusted publisher
        # registered on PyPI (https://docs.pypi.org/trusted-publishers/).
        # Remove this `if: false` to enable publishing.
        if: false
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: './dist/*'
